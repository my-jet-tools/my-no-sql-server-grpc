[package]
name = "my-no-sql-grpc-ui"
version = "0.1.0"
edition = "2024"

[features]
default = ["web"]
web = ["dioxus/web"]

[dependencies]
# Kept on the 0.7 line on purpose: dioxus-utils requires `dioxus = "0.7"`, and
# the `dx` CLI that builds this crate has to match the library's minor version.
# 0.8 is still an alpha on crates.io.
dioxus = { version = "0.7.10", features = ["router"] }
dioxus-utils = { tag = "0.7.0", git = "https://github.com/MyJetTools/dioxus-utils.git", features = [
    "web",
] }

reqwest = { version = "*", features = ["json"] }
futures = { version = "*" }

serde_json = { version = "*" }
serde = { version = "*", features = ["derive"] }

web-sys = { version = "*", features = [
    "Storage",
    "Window",
    "Document",
    "Element",
    "Navigator",
    "Clipboard",
] }
js-sys = { version = "*" }

[build-dependencies]
ci-utils = { git = "https://github.com/MyJetTools/ci-utils.git", tag = "0.1.3" }

[profile.release]
strip = "debuginfo"

# Its own workspace: the repository root is a workspace of the server, and this
# crate is built by `dx` for wasm32, never by cargo for the host.
[workspace]
