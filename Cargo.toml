[workspace]
resolver = "3"
# Only the server. The core, the macros and both clients live in the SDK, which
# this repository depends on by tag - the very same crates, from the repo an
# application takes them from.
members = ["server"]
# The UI is built by `dx` for wasm32, not by cargo for the host, so it is not a
# member - `ui/build.sh` builds it and puts the result into `wwwroot/`.
exclude = ["ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["amigin <amigin@gmail.com>"]

[workspace.dependencies]
# One tag for all three: they are one workspace over there, and a mixed set is
# not a combination anybody tests. The facade is a dev-dependency of the server
# (see server/Cargo.toml) - it carries the macros and both clients for the tests.
my-no-sql-grpc-abstractions = { tag = "0.1.0", git = "https://github.com/my-jet-tools/my-no-sql-grpc-sdk.git" }
my-no-sql-grpc-core = { tag = "0.1.0", git = "https://github.com/my-jet-tools/my-no-sql-grpc-sdk.git" }
my-no-sql-grpc-sdk = { tag = "0.1.0", git = "https://github.com/my-jet-tools/my-no-sql-grpc-sdk.git", features = [
    "macros",
    "data-writer",
    "data-reader",
] }

rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "with-tokio",
] }
my-logger = { tag = "1.3.0", git = "https://github.com/MyJetTools/my-logger.git" }
ci-utils = { tag = "0.1.3", git = "https://github.com/MyJetTools/ci-utils.git" }

ahash = "*"
arc-swap = "*"
parking_lot = "*"
