[package]
name = "my-no-sql-grpc-writer"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
my-no-sql-grpc-core = { workspace = true }

rust-extensions = { workspace = true }

tonic = { version = "*" }
tonic-prost = "*"
prost = "*"

tokio = { version = "*", features = ["rt", "sync", "time"] }
tokio-stream = "*"

[dev-dependencies]
# The round-trip example writes and then watches the same rows arrive.
my-no-sql-grpc-macros = { workspace = true }
my-no-sql-grpc-reader = { workspace = true }
tokio = { version = "*", features = ["full"] }

[build-dependencies]
ci-utils = { workspace = true }
